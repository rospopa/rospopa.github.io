    <path d="M56 118h460M56 205h460M56 292h460M56 379h460" stroke="#e4ebe4" stroke-width="3"/>
    <rect x="62" y="132" width="290" height="42" rx="8" fill="#2e8b57"/>
    <text x="80" y="160" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Collected rent and recoveries</text>
    <rect x="62" y="219" width="215" height="42" rx="8" fill="#89a98c"/>
    <text x="80" y="247" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#173c2b">Operating costs</text>
    <rect x="62" y="306" width="350" height="42" rx="8" fill="#b8e0b0"/>
    <text x="80" y="334" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#173c2b">Capital and leasing reserve</text>
    <circle cx="477" cy="153" r="32" fill="#e5f2e3"/><path d="M461 153h32m-16-16v32" stroke="#214d35" stroke-width="5"/>
