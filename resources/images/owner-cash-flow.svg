<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Industrial property cash flow</title>
  <desc id="desc">A warehouse feeds a cash flow diagram with rent, operating costs, capital work, and a reserve.</desc>
  <rect width="1200" height="675" rx="28" fill="#f2f6f1"/>
  <path d="M72 570h1056" stroke="#cfdbd0" stroke-width="3"/>
  <g transform="translate(95 155)">
    <path d="M0 112 185 10l185 102v232H0z" fill="#fff" stroke="#214d35" stroke-width="8" stroke-linejoin="round"/>
    <path d="M0 112 185 10l185 102" fill="none" stroke="#2e8b57" stroke-width="12" stroke-linejoin="round"/>
    <path d="M36 143h298v24H36z" fill="#b8e0b0"/>
    <path d="M50 191h92v153H50zm138 0h92v153h-92z" fill="#e5eee5" stroke="#214d35" stroke-width="6"/>
    <path d="M80 224h32v31H80zm138 0h32v31h-32z" fill="#83bd86"/>
    <text x="185" y="398" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#214d35">PROPERTY OPERATIONS</text>
  </g>
  <g transform="translate(520 105)">
