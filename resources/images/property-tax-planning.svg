<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Property tax planning calendar</title>
  <desc id="desc">An annual owner calendar tracks assessment review, appeal deadlines, tax payments, and tenant reconciliations.</desc>
  <rect width="1200" height="675" rx="28" fill="#f2f6f1"/>
  <rect x="145" y="102" width="910" height="438" rx="26" fill="#fff" stroke="#214d35" stroke-width="6"/>
  <path d="M145 188h910" stroke="#214d35" stroke-width="6"/>
  <path d="M350 102v-32m500 32v-32" stroke="#2e8b57" stroke-width="16" stroke-linecap="round"/>
  <text x="600" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#214d35">OWNER TAX CALENDAR</text>
  <g fill="#edf4ec" stroke="#d5e0d5" stroke-width="3">
    <rect x="190" y="220" width="190" height="112" rx="14"/><rect x="410" y="220" width="190" height="112" rx="14"/><rect x="630" y="220" width="190" height="112" rx="14"/><rect x="850" y="220" width="160" height="112" rx="14"/>
    <rect x="190" y="355" width="190" height="112" rx="14"/><rect x="410" y="355" width="190" height="112" rx="14"/><rect x="630" y="355" width="190" height="112" rx="14"/><rect x="850" y="355" width="160" height="112" rx="14"/>
  </g>
  <g font-family="Arial,sans-serif" fill="#214d35" text-anchor="middle">
    <text x="285" y="263" font-size="17" font-weight="700">VERIFY PINs</text><text x="285" y="293" font-size="15">and records</text>
    <text x="505" y="263" font-size="17" font-weight="700">REVIEW VALUE</text><text x="505" y="293" font-size="15">and classification</text>
    <text x="725" y="263" font-size="17" font-weight="700">FILE ON TIME</text><text x="725" y="293" font-size="15">if appropriate</text>
    <text x="930" y="263" font-size="17" font-weight="700">PAY BILLS</text><text x="930" y="293" font-size="15">and track escrow</text>
    <text x="285" y="398" font-size="17" font-weight="700">UPDATE MODEL</text><text x="285" y="428" font-size="15">after new evidence</text>
    <text x="505" y="398" font-size="17" font-weight="700">RECONCILE</text><text x="505" y="428" font-size="15">leases and refunds</text>
    <text x="725" y="398" font-size="17" font-weight="700">CHECK PROGRAMS</text><text x="725" y="428" font-size="15">eligibility and terms</text>
    <text x="930" y="398" font-size="17" font-weight="700">RECORD</text><text x="930" y="428" font-size="15">next dates</text>
  </g>
  <text x="600" y="588" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#536b58">Deadlines and processes vary by county, parcel, and tax year.</text>
</svg>
