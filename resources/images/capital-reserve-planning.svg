<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Commercial property capital and reserve planning</title>
  <desc id="desc">A property reserve plan connects scheduled building work, vacancy carrying costs, lender reserves, and unrestricted owner cash.</desc>
  <rect width="1200" height="675" rx="28" fill="#f2f6f1"/>
  <rect x="76" y="74" width="1048" height="520" rx="26" fill="#fff" stroke="#d2ded2" stroke-width="4"/>
  <text x="600" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#214d35">PLAN LIQUIDITY AROUND REAL PROPERTY EVENTS</text>
  <path d="M155 300h890" stroke="#9db89f" stroke-width="7" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <circle cx="210" cy="300" r="56" fill="#b8e0b0" stroke="#2e8b57" stroke-width="5"/>
    <path d="M179 306h62v32h-62zm-8-9 39-25 39 25" fill="none" stroke="#214d35" stroke-width="5" stroke-linejoin="round"/>
    <text x="210" y="397" font-size="18" font-weight="700" fill="#214d35">ROOF / SYSTEMS</text><text x="210" y="425" font-size="15" fill="#536b58">schedule + estimate</text>
    <circle cx="470" cy="300" r="56" fill="#e5eee5" stroke="#7eaa83" stroke-width="5"/>
    <path d="M455 275h30v50h-30zm-10 50h50m-42-38h14m-14 12h14" fill="none" stroke="#214d35" stroke-width="4"/>
    <text x="470" y="397" font-size="18" font-weight="700" fill="#214d35">VACANCY</text><text x="470" y="425" font-size="15" fill="#536b58">carry + re-lease</text>
    <circle cx="730" cy="300" r="56" fill="#dce9f3" stroke="#6f99b5" stroke-width="5"/>
    <path d="M704 280h52v40h-52zm10-12h32v12h-32" fill="none" stroke="#214d35" stroke-width="4"/>
    <text x="730" y="397" font-size="18" font-weight="700" fill="#214d35">LOAN / ESCROW</text><text x="730" y="425" font-size="15" fill="#536b58">restricted cash</text>
    <circle cx="990" cy="300" r="56" fill="#e5f2e3" stroke="#2e8b57" stroke-width="5"/>
    <path d="M963 315h54m-44-10v-18m14 18v-30m14 30v-14m-38 48h44" fill="none" stroke="#214d35" stroke-width="5" stroke-linecap="round"/>
    <text x="990" y="397" font-size="18" font-weight="700" fill="#214d35">AVAILABLE CASH</text><text x="990" y="425" font-size="15" fill="#536b58">usable owner funds</text>
  </g>
  <path d="m294 300 70 0m-15-15 15 15-15 15m260 0h70m-15-15 15 15-15 15m260 0h70m-15-15 15 15-15 15" fill="none" stroke="#214d35" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="194" y="490" width="812" height="58" rx="16" fill="#edf4ec"/>
  <text x="600" y="526" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#214d35">A reserve is a plan. Spending, tax treatment, and lender control are separate questions.</text>
</svg>
