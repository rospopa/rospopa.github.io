<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Commercial lease and occupancy planning</title>
  <desc id="desc">A lease document connects landlord and tenant responsibilities, occupancy costs, improvements, and delivery timing.</desc>
  <rect width="1200" height="675" rx="28" fill="#f2f6f1"/>
  <g transform="translate(450 90)">
    <path d="M0 0h260l100 100v370H0z" fill="#fff" stroke="#214d35" stroke-width="7" stroke-linejoin="round"/>
    <path d="M260 0v100h100" fill="#dcebdd" stroke="#214d35" stroke-width="6"/>
    <text x="48" y="150" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#214d35">LEASE TERMS</text>
    <path d="M48 190h250M48 228h250M48 266h205" stroke="#aec2b0" stroke-width="8" stroke-linecap="round"/>
    <rect x="48" y="305" width="264" height="95" rx="12" fill="#e9f2e8"/>
    <text x="66" y="344" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#214d35">COST + RESPONSIBILITY</text>
    <text x="66" y="375" font-family="Arial,sans-serif" font-size="16" fill="#536b58">Read the signed agreement</text>
  </g>
  <g transform="translate(115 195)">
    <circle cx="90" cy="88" r="55" fill="#b8e0b0"/>
    <path d="M64 96h52v50H64zm-10-7 36-24 36 24" fill="none" stroke="#214d35" stroke-width="6" stroke-linejoin="round"/>
    <text x="90" y="183" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#214d35">OWNER</text>
    <text x="90" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#536b58">Building duties</text>
  </g>
  <g transform="translate(880 195)">
    <circle cx="90" cy="88" r="55" fill="#dce9f3"/>
    <path d="M64 96h52v50H64zm-10-7 36-24 36 24" fill="none" stroke="#214d35" stroke-width="6" stroke-linejoin="round"/>
    <text x="90" y="183" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#214d35">TENANT</text>
    <text x="90" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#536b58">Use + payment</text>
  </g>
  <path d="M290 290h140m-18-18 18 18-18 18M770 290h140m-18-18 18 18-18 18" fill="none" stroke="#2e8b57" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#536b58">Rent labels do not replace the negotiated lease language.</text>
</svg>
