<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Commercial property records for an owner</title>
  <desc id="desc">An organized owner file contains leases, permits, inspection reports, warranties, and operating records.</desc>
  <rect width="1200" height="675" rx="28" fill="#f2f6f1"/>
  <rect x="95" y="110" width="1010" height="450" rx="26" fill="#fff" stroke="#d2ded2" stroke-width="4"/>
  <g transform="translate(145 205)">
    <path d="M0 60h155l34 38h158v210H0z" fill="#dcebdd" stroke="#214d35" stroke-width="6" stroke-linejoin="round"/>
    <path d="M0 104h347v204H0z" fill="#b8d9b7" stroke="#214d35" stroke-width="6"/>
    <path d="M30 145h286v135H30z" fill="#fff" stroke="#7d9e82" stroke-width="4"/>
    <text x="173" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#214d35">BUILDING FILE</text>
    <path d="M73 218h200m-200 25h162" stroke="#aec2b0" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g transform="translate(600 166)" font-family="Arial,sans-serif">
    <g><rect width="410" height="72" rx="14" fill="#f7f9f6" stroke="#d2ded2" stroke-width="3"/><path d="M27 22h29v34H27zm7-8h29v34" fill="none" stroke="#2e8b57" stroke-width="4"/><text x="82" y="45" font-size="20" font-weight="700" fill="#214d35">Signed leases + amendments</text></g>
    <g transform="translate(0 88)"><rect width="410" height="72" rx="14" fill="#f7f9f6" stroke="#d2ded2" stroke-width="3"/><path d="M27 22h29v34H27zm7-8h29v34" fill="none" stroke="#2e8b57" stroke-width="4"/><text x="82" y="45" font-size="20" font-weight="700" fill="#214d35">Permits + approvals</text></g>
    <g transform="translate(0 176)"><rect width="410" height="72" rx="14" fill="#f7f9f6" stroke="#d2ded2" stroke-width="3"/><path d="M27 22h29v34H27zm7-8h29v34" fill="none" stroke="#2e8b57" stroke-width="4"/><text x="82" y="45" font-size="20" font-weight="700" fill="#214d35">Inspection + repair history</text></g>
    <g transform="translate(0 264)"><rect width="410" height="72" rx="14" fill="#f7f9f6" stroke="#d2ded2" stroke-width="3"/><path d="M27 22h29v34H27zm7-8h29v34" fill="none" stroke="#2e8b57" stroke-width="4"/><text x="82" y="45" font-size="20" font-weight="700" fill="#214d35">Warranties + service logs</text></g>
  </g>
  <text x="600" y="615" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#536b58">Keep dated source documents, not just summary notes.</text>
</svg>
