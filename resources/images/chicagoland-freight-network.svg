<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Chicagoland freight network schematic</title>
  <desc id="desc">A schematic industrial logistics network connects highways, rail, airports, intermodal facilities, and local sites. It is not a geographic map.</desc>
  <rect width="1200" height="675" rx="28" fill="#f2f6f1"/>
  <rect x="65" y="70" width="1070" height="535" rx="26" fill="#fff" stroke="#d2ded2" stroke-width="4"/>
  <path d="M174 160c183 25 231 140 395 161s258-48 454 41M153 453c177-71 288-86 436-27s257 89 449 3" fill="none" stroke="#7eaa83" stroke-width="14" stroke-linecap="round"/>
  <path d="M306 115c41 136 40 283 4 433M635 110c-7 148 27 273 0 444M925 118c-80 98-59 252 8 423" fill="none" stroke="#7aa2bc" stroke-width="8" stroke-dasharray="16 12"/>
  <g fill="#2e8b57" stroke="#fff" stroke-width="7">
    <circle cx="220" cy="206" r="28"/><circle cx="514" cy="305" r="28"/><circle cx="807" cy="340" r="28"/><circle cx="1012" cy="362" r="28"/>
    <circle cx="269" cy="444" r="28"/><circle cx="648" cy="426" r="28"/><circle cx="947" cy="426" r="28"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#214d35">
    <text x="220" y="256" text-anchor="middle">LOCAL SITE</text>
    <text x="514" y="355" text-anchor="middle">RAIL</text>
    <text x="807" y="390" text-anchor="middle">INTERMODAL</text>
    <text x="1012" y="412" text-anchor="middle">AIR CARGO</text>
    <text x="269" y="494" text-anchor="middle">CUSTOMERS</text>
    <text x="648" y="476" text-anchor="middle">HIGHWAY</text>
    <text x="947" y="476" text-anchor="middle">SUPPLIERS</text>
  </g>
  <rect x="360" y="524" width="480" height="48" rx="14" fill="#e9f2e8"/>
  <text x="600" y="554" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#214d35">SCHEMATIC ONLY. TEST ACTUAL ROUTES AND ACCESS.</text>
