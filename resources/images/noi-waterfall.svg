<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Net operating income calculation</title>
  <desc id="desc">A flow diagram shows potential rent less vacancy plus collectible recoveries and other income, less property operating expenses, equals net operating income.</desc>
  <rect width="1200" height="675" rx="28" fill="#f2f6f1"/>
  <rect x="72" y="90" width="1056" height="495" rx="26" fill="#fff" stroke="#d2ded2" stroke-width="4"/>
  <text x="600" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#214d35">RECONCILE PROPERTY INCOME TO NOI</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="130" y="205" width="300" height="74" rx="16" fill="#e5f2e3"/><text x="280" y="250" font-size="20" font-weight="700" fill="#214d35">POTENTIAL RENT</text>
    <rect x="130" y="310" width="300" height="74" rx="16" fill="#f4eee7"/><text x="280" y="355" font-size="20" font-weight="700" fill="#214d35">VACANCY + CREDIT LOSS</text>
    <rect x="130" y="415" width="300" height="74" rx="16" fill="#e5f2e3"/><text x="280" y="460" font-size="20" font-weight="700" fill="#214d35">RECOVERIES + OTHER INCOME</text>
    <text x="470" y="256" font-size="32" font-weight="700" fill="#2e8b57">-</text>
    <text x="470" y="361" font-size="32" font-weight="700" fill="#2e8b57">+</text>
    <path d="M440 246h75m-15-15 15 15-15 15M440 351h75m-15-15 15 15-15 15M440 456h75m-15-15 15 15-15 15" fill="none" stroke="#9ab69d" stroke-width="4"/>
    <rect x="540" y="270" width="225" height="143" rx="20" fill="#edf4ec" stroke="#9ab69d" stroke-width="4"/>
    <text x="652" y="326" font-size="22" font-weight="700" fill="#214d35">EFFECTIVE</text><text x="652" y="358" font-size="22" font-weight="700" fill="#214d35">GROSS INCOME</text>
    <path d="M776 340h72m-15-15 15 15-15 15" fill="none" stroke="#2e8b57" stroke-width="5"/>
    <rect x="860" y="270" width="205" height="143" rx="20" fill="#e9eff1" stroke="#9fb4bb" stroke-width="4"/>
    <text x="962" y="326" font-size="20" font-weight="700" fill="#214d35">LESS OPERATING</text><text x="962" y="358" font-size="20" font-weight="700" fill="#214d35">EXPENSES</text>
    <path d="M760 445v62h170v-82" fill="none" stroke="#2e8b57" stroke-width="5"/>
    <rect x="520" y="475" width="320" height="68" rx="16" fill="#2e8b57"/>
    <text x="680" y="518" font-size="20" font-weight="700" fill="#fff">NET OPERATING INCOME</text>
  </g>
  <text x="600" y="565" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#536b58">Debt service, owner income tax, and major capital outlays are separate cash flow items.</text>
</svg>
