<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Industrial property due diligence</title>
  <desc id="desc">A site plan, inspection clipboard, and warehouse represent physical, legal, environmental, and operational diligence.</desc>
  <rect width="1200" height="675" rx="28" fill="#f2f6f1"/>
  <rect x="72" y="80" width="1056" height="515" rx="26" fill="#fff" stroke="#d2ded2" stroke-width="4"/>
  <g transform="translate(120 140)">
    <rect width="410" height="360" rx="18" fill="#e7f0e5"/>
    <path d="M42 285V110l162-70 163 70v175z" fill="#fff" stroke="#214d35" stroke-width="7" stroke-linejoin="round"/>
    <path d="M42 110 204 40l163 70" fill="none" stroke="#2e8b57" stroke-width="10"/>
    <path d="M75 137h258v23H75zm14 54h78v94H89zm119 0h78v94h-78z" fill="#b8e0b0" stroke="#214d35" stroke-width="5"/>
    <path d="M324 331h48M305 349h70" stroke="#2e8b57" stroke-width="8" stroke-linecap="round"/>
    <text x="205" y="336" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#214d35">BUILDING + PARCEL</text>
  </g>
  <g transform="translate(610 105)">
    <rect x="42" y="10" width="390" height="455" rx="22" fill="#f9fbf8" stroke="#214d35" stroke-width="6"/>
    <rect x="143" y="0" width="190" height="52" rx="16" fill="#2e8b57"/>
    <text x="238" y="35" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">REVIEW FILE</text>
    <g font-family="Arial,sans-serif" fill="#214d35">
      <rect x="85" y="100" width="34" height="34" rx="7" fill="#e5f2e3"/><path d="m94 117 8 8 14-17" fill="none" stroke="#2e8b57" stroke-width="5"/><text x="140" y="125" font-size="20">Physical systems</text>
      <rect x="85" y="174" width="34" height="34" rx="7" fill="#e5f2e3"/><path d="m94 191 8 8 14-17" fill="none" stroke="#2e8b57" stroke-width="5"/><text x="140" y="199" font-size="20">Environmental history</text>
      <rect x="85" y="248" width="34" height="34" rx="7" fill="#e5f2e3"/><path d="m94 265 8 8 14-17" fill="none" stroke="#2e8b57" stroke-width="5"/><text x="140" y="273" font-size="20">Title, survey, access</text>
      <rect x="85" y="322" width="34" height="34" rx="7" fill="#e5f2e3"/><path d="m94 339 8 8 14-17" fill="none" stroke="#2e8b57" stroke-width="5"/><text x="140" y="347" font-size="20">Use, leases, utilities</text>
    </g>
  </g>
  <text x="600" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#536b58">Findings need an owner, a deadline, and a documented decision.</text>
</svg>
