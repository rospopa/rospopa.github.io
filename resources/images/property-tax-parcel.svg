<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Industrial property tax and parcel review</title>
  <desc id="desc">A parcel map and tax statement connect parcel identification, assessment, local rates, and the final bill.</desc>
  <rect width="1200" height="675" rx="28" fill="#f2f6f1"/>
  <rect x="72" y="80" width="1056" height="515" rx="26" fill="#fff" stroke="#d2ded2" stroke-width="4"/>
  <g transform="translate(120 145)">
    <rect width="460" height="360" rx="18" fill="#edf4ec"/>
    <path d="M40 52h174v104H40zm196 0h184v104H236zM40 174h174v144H40zm196 0h184v144H236z" fill="#fff" stroke="#7d9e82" stroke-width="5"/>
    <path d="M56 87h112v50H56zm196 0h120v50H252zM56 205h112v90H56zm196 0h120v90H252z" fill="#b8e0b0"/>
    <path d="M218 42v286M30 165h360" stroke="#2e8b57" stroke-width="6" stroke-dasharray="10 8"/>
    <text x="230" y="348" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#214d35">PARCEL + TAX DISTRICTS</text>
  </g>
  <g transform="translate(665 118)">
    <path d="M25 0h330l80 80v370H25z" fill="#fff" stroke="#214d35" stroke-width="6" stroke-linejoin="round"/>
    <path d="M355 0v80h80" fill="#e3eee2" stroke="#214d35" stroke-width="5"/>
    <text x="65" y="130" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#214d35">PROPERTY TAX</text>
    <text x="65" y="165" font-family="Arial,sans-serif" font-size="17" fill="#536b58">Review each PIN and tax year</text>
    <path d="M65 205h290M65 246h290M65 287h290" stroke="#ccd9cc" stroke-width="6" stroke-linecap="round"/>
    <text x="65" y="346" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#214d35">ASSESSMENT</text>
    <text x="220" y="346" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#214d35">LEVY / RATE</text>
    <path d="M185 340h20m-7-7 7 7-7 7" fill="none" stroke="#2e8b57" stroke-width="4"/>
    <rect x="65" y="370" width="290" height="46" rx="10" fill="#b8e0b0"/>
    <text x="210" y="400" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#214d35">TAX BILL</text>
  </g>
  <text x="600" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#536b58">Illustrative only. Local assessment and billing rules vary by parcel.</text>
</svg>
