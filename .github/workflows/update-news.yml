name: Update industrial news

# Refreshes the Chicago industrial news carousel on the public homepage and the
# community board list on /resources/community/ (from this repo's GitHub
# Discussions) once a day by regenerating resources/news.json,
# resources/community.json, and the generated site files, then
# committing them. GitHub Pages redeploys on the push. The commit message
# carries [skip render] so the private Render service is not redeployed.
on:
  schedule:
    - cron: '17 11 * * *'   # daily, 11:17 UTC (6:17 am Chicago during daylight time)
  workflow_dispatch:

permissions:
  contents: write
  discussions: read

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch headlines and rebuild generated files
        run: node build-site.mjs --news
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/news.json resources/community.json resources/community/index.html index.html resources/search-index.json sitemap.xml feed.xml llms-full.txt
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Update Chicago industrial news [skip render]"
          git pull --rebase origin master
          git push origin HEAD:master
